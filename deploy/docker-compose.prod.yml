# Server stack, deployed to /opt/postpilot by the GitHub Actions pipeline.
# Images come from GitHub Container Registry; only Caddy is reachable from the internet.
name: postpilot

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postpilot}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-n8n-db.sh:/docker-entrypoint-initdb.d/10-n8n.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is set by the deploy job}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postpilot}
      N8N_INTERNAL_URL: http://n8n:5678
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: ${N8N_IMAGE:?N8N_IMAGE is set by the deploy job}
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL in .env}
      N8N_EDITOR_BASE_URL: ${N8N_WEBHOOK_URL}
      # n8n sits behind Caddy
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TIMEZONE:-Africa/Douala}
      TZ: ${TIMEZONE:-Africa/Douala}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postpilot}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      APP_INTERNAL_URL: http://web:3000
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy

  # Reverse proxy. With APP_DOMAIN set it gets free Let's Encrypt certificates automatically.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5678:5678"
    environment:
      APP_SITE: ${APP_DOMAIN:-:80}
      N8N_SITE: ${APP_DOMAIN:-}:5678
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - n8n

volumes:
  db-data:
  web-data:
  n8n-data:
  caddy-data:
  caddy-config:
